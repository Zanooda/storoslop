name: Build macOS arm64 binary

# Dispatch-only: builds the darwin-arm64 release binary on its own.
#
# The full release run builds this on macos-14 alongside ~20 other jobs, and
# GitHub's macOS arm64 pool routinely queues it past the point where the run is
# cancelled, leaving the release without its Apple-silicon asset. Running it in
# isolation lets it be scheduled and finished independently; the artifact name
# matches the one the release job consumes.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Release binary: darwin-arm64
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Restore bun store
        id: bun-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Build native addon (bazel)
        uses: ./.github/actions/bazel-natives
        with:
          targets: darwin-arm64
          cache-scope: release-darwin-arm64
      - name: Build release binary
        env:
          RELEASE_TARGETS: darwin-arm64
        run: bun run ci:release:build-binaries
      - name: Smoke release binary
        run: |
          runtime_dir="$(mktemp -d)"
          HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" packages/coding-agent/binaries/storoslop-darwin-arm64 --version
          HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" packages/coding-agent/binaries/storoslop-darwin-arm64 --smoke-test
      - name: Upload release binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storoslop-binary-darwin-arm64
          path: packages/coding-agent/binaries/storoslop-darwin-arm64
