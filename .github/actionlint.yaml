# actionlint config.
#
# No self-hosted runner labels are in use: every workflow job declares a
# GitHub-hosted runner (see .github/workflows/ci.yml). actionlint knows those
# labels itself, so `self-hosted-runner:` stays unset. If a job is ever pointed
# at a self-hosted label again, register it here as well:
#
# self-hosted-runner:
#    labels:
#       - <label>
